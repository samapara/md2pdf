<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Lock the page down: only files from this site may load, nothing may be sent anywhere. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <title>MD to PDF</title>
  <link rel="stylesheet" href="vendor/github.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <strong class="brand">MD → PDF</strong>
    <label class="btn">Open .md<input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden></label>
    <label>Page
      <select id="page-size">
        <option value="A4">A4</option>
        <option value="Letter">Letter</option>
        <option value="Legal">Legal</option>
      </select>
    </label>
    <label>Margin
      <select id="margin">
        <option value="10mm">Narrow</option>
        <option value="18mm" selected>Normal</option>
        <option value="25mm">Wide</option>
      </select>
    </label>
    <label>Font
      <select id="font">
        <option value="sans">Sans</option>
        <option value="serif">Serif</option>
      </select>
    </label>
    <label><input id="page-breaks" type="checkbox"> Break before H1</label>
    <span class="spacer"></span>
    <button id="export" class="btn primary">Download PDF</button>
  </header>

  <main class="panes">
    <textarea id="editor" spellcheck="false" placeholder="Paste or type Markdown, or drop a .md file here…"></textarea>
    <div class="preview-wrap">
      <article id="preview" class="markdown-body"></article>
    </div>
  </main>

  <footer class="footer">This website runs entirely in your browser. Your data is never sent to a server.</footer>

  <div id="drop" class="drop" hidden>Drop your .md file</div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
